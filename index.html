  body{font-family:'ChiffresPx','Pixelify Sans',monospace;-webkit-tap-highlight-color:transparent}
  button,input{font-family:inherit;color:var(--encre)}
  canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .console{max-width:440px;margin:0 auto;height:100dvh;min-height:560px;padding:8px;display:flex}
  .ecran{flex:1;position:relative;overflow:hidden;border:4px solid var(--bois);border-radius:12px;background:var(--parch);box-shadow:0 5px 0 #000}
  .p2{font-family:'Press Start 2P',monospace}
  .demo{position:absolute;top:8px;left:8px;z-index:30;font-size:7px;background:var(--or);color:var(--encre);border:2px solid var(--encre);padding:4px 5px}

  /* --- Boutons pixel --- */
  .btn{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.6;color:#fff;background:var(--rouge);
    border:3px solid var(--encre);padding:12px;width:100%;cursor:pointer;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.25), 0 4px 0 var(--encre)}
  .btn:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 1px 0 var(--encre)}
  .btn.clair{background:var(--parch);color:var(--encre)}
  .btn.mini{width:auto;padding:7px 9px;font-size:8px}
  .lien{background:none;border:0;color:#fff;text-decoration:underline;font-size:15px;cursor:pointer;padding:6px;text-shadow:1px 1px 0 #000}

  /* --- Scène façon Layton --- */
  .fond{position:absolute;inset:0}
  .fond canvas{width:100%;height:100%;object-fit:cover}
  .acteur{position:absolute;bottom:140px;width:38%;transition:filter .25s, transform .25s;z-index:2}
  .acteur canvas{width:100%;height:auto}
  .acteur.g{left:1%} .acteur.d{right:1%} .acteur.c{left:31%}
  .acteur.seul{left:16%;width:68%;bottom:24px}            /* grand, coupé à la taille par la bulle, comme dans Layton */
  .accueil-roi{left:27%!important;width:46%!important}
  .acteur canvas{position:relative;z-index:1}
  .ombre{position:absolute;left:12%;right:12%;bottom:-4px;height:14px;border-radius:50%;background:rgba(20,30,10,.35)}
  .acteur .respire{animation:respire 1.4s steps(2) infinite}
  @keyframes respire{50%{transform:translateY(-3px)}}
  .bulle{position:absolute;left:8px;right:8px;bottom:10px;min-height:150px;z-index:5;cursor:pointer;
    background:var(--parch);border:3px solid var(--bois);border-radius:16px;padding:22px 16px 26px;
    box-shadow:inset 0 0 0 3px var(--parch2), 0 4px 0 rgba(0,0,0,.4);font-size:20px;line-height:1.35}
  .onglet{position:absolute;top:-17px;left:14px;background:#fbf3dc;border:3px solid var(--bois);border-radius:12px;
    padding:6px 12px;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--bois);text-transform:uppercase}
  .plume{position:absolute;right:12px;bottom:8px;width:22px;animation:clign .9s steps(2) infinite}
  @keyframes clign{50%{opacity:.15}}

  /* --- Bandeau du haut pendant le jeu --- */
  .hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    padding:10px 10px 22px;background:linear-gradient(rgba(28,22,17,.88),rgba(28,22,17,.55) 65%,rgba(28,22,17,0))}
  .hud-lieu{font-size:9px;color:#fff;text-shadow:2px 2px 0 #000;line-height:1.5}
  .hud-demo{font-size:6px;color:var(--or)}
  .prog{display:flex;gap:4px;margin-top:6px}
  .prog i{width:12px;height:12px;border:2px solid #000;background:#6b5a48;display:block}
  .prog i.ok{background:var(--vert)} .prog i.ici{background:var(--rouge);box-shadow:0 0 0 2px #fff}
  .prog i.roi{background:var(--or)}
  .hud-d{display:flex;gap:6px;flex:none}

  /* --- Accueil --- */
  .titre-zone{position:absolute;top:34px;left:0;right:0;text-align:center;z-index:3}
  .titre{font-size:18px;line-height:1.5;color:#fff;margin:0;text-shadow:3px 3px 0 var(--encre),-2px -2px 0 var(--encre),2px -2px 0 var(--encre),-2px 2px 0 var(--encre)}
  .sous{font-size:8px;color:var(--encre);background:var(--parch);display:inline-block;padding:5px 7px;margin-top:10px;border:2px solid var(--encre)}
  .bas{position:absolute;left:12px;right:12px;bottom:14px;z-index:5;display:flex;flex-direction:column;gap:10px}
  .champ{width:100%;font-size:20px;padding:11px;border:3px solid var(--encre);background:#fffaf0;color:var(--encre);text-align:center}
  .champ::placeholder{color:#8a7a62}

  /* --- Énigme façon Layton --- */
  .enigme{position:absolute;inset:0;display:flex;flex-direction:column;background:#3b2a1c;overflow:auto}
  .entete{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--bois);color:var(--parch);border-bottom:3px solid var(--encre)}
  .entete .p2{font-size:11px}
  .feuille{margin:12px;background:var(--parch);border:3px solid var(--encre);padding:14px;position:relative;
    box-shadow:inset 0 0 0 3px var(--parch2)}
  .portrait{position:absolute;right:8px;top:-6px;width:64px}
  #groupe canvas{width:100%;height:auto;display:block}
  .rebus .p2{font-size:20px}
  .rebus{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 14px;font-size:22px}
  .question{font-size:20px;line-height:1.35;margin:0 70px 14px 0}
  .msg{min-height:26px;font-size:18px;margin:10px 0 0}
  .msg.ko{color:var(--rouge)} .msg.ok{color:var(--vert)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
  .cadenas{display:flex;justify-content:center;gap:8px;margin:4px 0 14px}
  .mol{display:flex;flex-direction:column;align-items:center;gap:4px}
  .mol button{width:48px;height:34px;border:3px solid var(--encre);background:#fffaf0;color:var(--encre);font-size:14px;cursor:pointer}
  .chif{width:48px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--encre);color:var(--or);font-size:20px;border:3px solid #000}
  .choix{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:19px;background:#fffaf0;color:var(--encre);border:3px solid var(--encre);padding:8px 10px;cursor:pointer}
  .opt canvas{width:40px;height:40px}
  .indices-zone{margin:0 12px 14px;background:#2a1e14;border:3px solid var(--encre);padding:12px;color:var(--parch)}
  .pieces{display:flex;gap:10px;align-items:center;margin-top:8px}
  .piece{width:44px;height:44px;border-radius:50%;border:3px solid var(--encre);background:var(--or);color:var(--encre);
    font-family:'Press Start 2P',monospace;font-size:12px;cursor:pointer;box-shadow:inset -3px -3px 0 #c99a1a, inset 3px 3px 0 #fff2a8}
  .piece:disabled{background:#6b5a48;box-shadow:none;cursor:default;color:#3b2a1c}
  .indice{background:var(--parch);color:var(--encre);padding:8px 10px;margin-top:8px;font-size:17px;border-left:6px solid var(--or)}

  /* --- Carte --- */
  .carte-page{position:absolute;inset:0;display:flex;flex-direction:column;background:#3b2a1c}
  .barre{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bois);color:var(--parch);border-bottom:3px solid var(--encre)}
  .barre .p2{font-size:9px}
  .carte{position:relative;margin:10px;border:3px solid var(--encre)}
  .carte canvas{width:100%;height:auto}
  .styles{display:flex;gap:6px;margin:10px 10px 0}
  .styles button{flex:1;font-family:'Press Start 2P',monospace;font-size:8px;padding:8px 4px;border:3px solid var(--encre);background:var(--parch2);color:var(--encre);cursor:pointer}
  .styles button.actif{background:var(--or)}
  .zone{position:absolute;border:2px dashed var(--encre);pointer-events:none}
  .loupe{position:absolute;right:4px;top:4px;width:52%;border:3px solid var(--encre);box-shadow:3px 3px 0 rgba(0,0,0,.35);background:#fff}
  .loupe .etiq{position:absolute;left:-3px;bottom:-3px;transform:translateY(100%);font-family:'Press Start 2P',monospace;font-size:7px;background:var(--encre);color:var(--parch);padding:3px 5px}
  .osm{margin:-6px 12px 8px;font-size:12px;color:#c9b48a;text-align:right}
  .mq{position:absolute;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;padding:0;cursor:pointer;
    border:2px solid var(--encre);font-family:'Press Start 2P',monospace;font-size:7px;line-height:1;color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1.5px #fffaf0, 1px 2px 0 1.5px rgba(0,0,0,.35)}
  .mq::before{content:"";position:absolute;inset:-10px;border-radius:50%} /* zone tactile élargie, invisible */
  .mq.suivant{background:var(--rouge);z-index:3;animation:pulse 1s ease-in-out infinite}
  .mq.fait{background:var(--vert)} .mq.verrou{background:#8a7a66;cursor:default}
  .mq.petit{width:16px;height:16px}
  @keyframes pulse{50%{box-shadow:0 0 0 1.5px #fffaf0, 0 0 0 6px rgba(184,67,44,.45)}}
  @keyframes saute{50%{transform:translate(-50%,-62%)}}
  .liste{display:flex;flex-direction:column;gap:8px;padding:0 10px 12px;overflow:auto}
  .ligne{display:flex;align-items:center;gap:10px;background:var(--parch);color:var(--encre);border:3px solid var(--encre);padding:9px;font-size:18px;text-align:left;cursor:pointer}
  .ligne small{display:block;font-size:14px;color:#6b5a48}
  .ligne .n{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:3px solid var(--encre);color:#fff;font-family:'Press Start 2P',monospace;font-size:9px}
  .ligne.verrou{opacity:.55;cursor:default}

  /* --- Récompense / fin / carnet --- */
  .centre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center;background:#3b2a1c;color:var(--parch)}
  .objet{width:120px;animation:pop .5s steps(5)}
  @keyframes pop{0%{transform:scale(.2)}80%{transform:scale(1.15)}100%{transform:scale(1)}}
  .carton{background:var(--parch);color:var(--encre);border:3px solid var(--encre);padding:14px;width:100%;box-shadow:inset 0 0 0 3px var(--parch2)}
  .confetti{position:absolute;top:-12px;width:8px;height:8px;z-index:9;animation:tombe linear forwards}
  @keyframes tombe{to{transform:translateY(105vh)}}
  .voile{position:fixed;inset:0;background:rgba(10,7,4,.7);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
  .carnet{background:var(--parch);color:var(--encre);border:4px solid var(--encre);width:100%;max-width:410px;max-height:88vh;overflow:auto;padding:16px;box-shadow:inset 0 0 0 3px var(--parch2)}
  .carnet h2{font-size:11px;margin:0 0 12px}
  .grille{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
  .case{background:#fffaf0;border:3px solid var(--encre);min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-size:14px;text-align:center}
  .case canvas{width:52px;height:auto}
  .case.vide{background:var(--parch2);color:#8a7a62;border-style:dashed}
</style>
</head>
<body>
<div class="console"><div class="ecran" id="app"></div></div>

<script src="jeu.js"></script>
<script>
/* =================================================================
   CONTENU DU JEU — la seule partie qu'Arthur modifie.
   « ROI: » au début d'une ligne = c'est le Roi qui parle.
   (Contenu fictif de démonstration, à remplacer après repérage.)
   ================================================================= */
/* =================================================================
   MOTEUR — Arthur n'a pas besoin d'y toucher.
   ================================================================= */
const CLE = "roi-menhirs-v1";
const melangeMorceaux = () => { const o = [0,1,2,3,4,5]; for(let i = 5; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
const VIDE = () => ({ ordre: melangeMorceaux(), styleCarte:"A", equipe:"", introVue:false, faites:[], carnet:[], persos:[], indices:0, fini:false });
let S = charger();
const app = document.getElementById("app");
let minuteur = null;
function charger(){
  try {
    const s = Object.assign(VIDE(), JSON.parse(localStorage.getItem(CLE)) || {});

/* ---------- Pixelisation : n'importe quel dessin vectoriel → pixel art ----------
   Le dessin est rendu en très basse résolution puis agrandi sans lissage.
   Les dessins d'Arthur (PNG/SVG) pourront passer par le même filtre. */
const cache = new Map();
function pixel(svg, w, h){
  const k = svg + w + "x" + h;
  if(cache.has(k)) return cache.get(k).then(src => copie(src));
  const p = new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.imageSmoothingEnabled = true; x.drawImage(img, 0, 0, w, h);
      try {
        const d = x.getImageData(0,0,w,h), a = d.data;
        for(let i=0;i<a.length;i+=4){
          a[i+3] = a[i+3] > 120 ? 255 : 0;                       // bords nets
          for(let j=0;j<3;j++) a[i+j] = Math.round(a[i+j]/20)*20; // palette réduite
        }
        x.putImageData(d,0,0);
      } catch(e){}
      res(c);
    };
    img.onerror = () => res(document.createElement("canvas"));
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
  cache.set(k, p);
  return p.then(src => copie(src));
}
function copie(src){ const c = document.createElement("canvas"); c.width = src.width; c.height = src.height;
  c.getContext("2d").drawImage(src,0,0); c.className = "px"; return c; }
function emojiPixel(e, n=20){
  const c = document.createElement("canvas"); c.width = n; c.height = n; c.className = "px";
  const x = c.getContext("2d"); x.font = `${n-3}px serif`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(e, n/2, n/2+1);
  try { const d = x.getImageData(0,0,n,n); for(let i=3;i<d.data.length;i+=4) d.data[i] = d.data[i] > 110 ? 255 : 0; x.putImageData(d,0,0); } catch(_){}
  return c;
}
function monter(sel, svg, w, h, cls){
  const el = typeof sel === "string" ? app.querySelector(sel) : sel;
  if(!el) return;
  pixel(svg, w, h).then(c => { if(cls) c.classList.add(cls); el.innerHTML = ""; el.appendChild(c); });
}

/* ---------- Outils d'écran ---------- */
function vider(){ clearInterval(minuteur); app.innerHTML = ""; }
const lignes = arr => arr.map(l => l.startsWith("ROI:") ? { qui:"roi", t:l.slice(4).trim() } : { qui:"perso", t:l });

/* Scène de dialogue : décor plein écran, UN personnage face au joueur, bulle parchemin.
   Le Roi n'apparaît que dans son jardin (intro et finale) : un menhir ne se déplace pas ! */
const IMMOBILES = ["roi", "boiliere"];
/* Hauteur (dans le dessin, de 0 = haut à 190 = pieds) où la bulle coupe le personnage : sous la taille, comme dans Layton */
/* Remonte le décor dans les dialogues : on coupe du ciel en haut pour que le lieu apparaisse au-dessus du personnage */
const REMONTE = { mairie:1.35, puits:1.3, halles:1.4, eglise:1, boiliere:1.15, lavoir:1.15 };
/* Taille du personnage dans sa scène (1 = normal) */
const TAILLE = { coq: .6 };
const COUPE = { roi:138, romain:134, marchande:126, boiliere:142, grenouille:170, mystere:140 }; // les menhirs ne bougent pas, même pas pour respirer
function scene({ decor, perso, texte, fin, lieu, ici }){
  vider();
  const p = perso || { nom: "Le Roi", dessin: "roi" };
  const L = texte.map(l => l.startsWith("ROI:") ? l.slice(4).trim() : l);
  app.innerHTML = `${hud(lieu || "", ici)}<div class="fond" id="fond"></div>
    <div class="acteur seul"><div class="${IMMOBILES.includes(p.dessin) ? "" : "respire"}" id="sPerso"></div></div>
    <div class="bulle" id="bulle"><div class="onglet">${esc(p.nom)}</div><div id="txt"></div>${PLUME}</div>`;
  brancherHud();
  const z = REMONTE[decor] || 1, fond = app.querySelector("#fond");
  fond.style.top = (-(z - 1) * 100) + "%"; fond.style.height = (z * 100) + "%"; fond.style.bottom = "auto";
  monter("#fond", DECORS[decor], 150, 200);
  monter("#sPerso", PERSOS[p.dessin], 72, 114);
  const acteur = app.querySelector(".acteur.seul"), bulle = app.querySelector("#bulle");
  const placer = () => { if(!acteur.isConnected) return removeEventListener("resize", placer);
    const t = TAILLE[p.dessin] || 1; acteur.style.width = (68 * t) + "%"; acteur.style.left = ((100 - 68 * t) / 2) + "%";
    const w = acteur.offsetWidth, hautBulle = bulle.offsetHeight + 10;
    acteur.style.bottom = (hautBulle - (190 - (COUPE[p.dessin] || 140)) * w / 120) + "px"; };
  placer(); addEventListener("resize", placer);
  let i = 0, ecrit = false;
  const txt = app.querySelector("#txt"), plume = app.querySelector(".plume");
  function montrer(){
    let k = 0; ecrit = true; plume.style.visibility = "hidden"; txt.textContent = "";
    clearInterval(minuteur);
    minuteur = setInterval(() => { k++; txt.textContent = L[i].slice(0,k);
      if(k >= L[i].length){ clearInterval(minuteur); ecrit = false; plume.style.visibility = "visible"; } }, 24);
  }
  app.querySelector("#bulle").onclick = () => {
    if(ecrit){ clearInterval(minuteur); txt.textContent = L[i]; ecrit = false; plume.style.visibility = "visible"; return; }
    i++; i < L.length ? montrer() : fin();
  };
  montrer();
}

/* Bandeau du haut : lieu, progression, accès à la carte et au carnet */
function hud(lieu, ici){
  const cases = JEU.etapes.map(e => `<i class="${S.faites.includes(e.id) ? "ok" : e.id === ici ? "ici" : ""}" title="${esc(e.lieu)}"></i>`).join("")
    + `<i class="${S.fini ? "ok" : ici === "roi" ? "ici" : "roi"}" title="Le Roi"></i>`;
  return `<div class="hud"><div><div class="hud-lieu p2">${esc(lieu)}</div><div class="prog">${cases}</div>${JEU.demo ? `<div class="hud-demo p2" style="margin-top:6px">DÉMO</div>` : ""}</div>
    <div class="hud-d">${S.introVue ? `<button class="btn mini clair" data-hud="carte">Carte</button>` : ""}<button class="btn mini clair" data-hud="carnet">Carnet</button></div></div>`;
}
function brancherHud(){
  app.querySelectorAll("[data-hud]").forEach(b => b.onclick = ev => { ev.stopPropagation(); b.dataset.hud === "carte" ? carte() : carnet(); });
}

/* ---------- Cloche colorée et balance (énigme de Gaston) ---------- */
function cloche(cx, y, s, c){
  return `<g transform="translate(${cx} ${y}) scale(${s})">
    <rect x="-3" y="0" width="6" height="5" fill="#5b3a1e"/>
    <path d="M-5 5 H5 Q13 7 14 24 Q15 32 19 36 H-19 Q-15 32 -14 24 Q-13 7 -5 5Z" fill="${c}" stroke="#2a2420" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M-8 10 Q-11 18 -11 28" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none"/>
    <rect x="-19" y="34" width="38" height="4" fill="#2a2420" opacity=".35"/>
    <circle cx="0" cy="40" r="4" fill="#f2c335" stroke="#2a2420" stroke-width="2"/></g>`;
}
function balanceSVG(objets, pente){
  const t = pente * 11 * Math.PI / 180, cx = 150, cy = 46, L = 104;
  const ex = [cx - L * Math.cos(t), cx + L * Math.cos(t)], ey = [cy - L * Math.sin(t), cy + L * Math.sin(t)];
  const plateau = (i) => { const x = ex[i], y = ey[i] + 46, o = objets[i];
    return `<path d="M${x} ${ey[i]} L${x-34} ${y} M${x} ${ey[i]} L${x+34} ${y}" stroke="#2a2420" stroke-width="2"/>
      ${o ? cloche(x, y - 44, 1.15, o.couleur) : ""}
      <path d="M${x-40} ${y} H${x+40} L${x+30} ${y+12} H${x-30}Z" fill="#d9b36a" stroke="#2a2420" stroke-width="3" stroke-linejoin="round"/>
      <rect x="${x-36}" y="${y+2}" width="72" height="3" fill="#f2d79a"/>
      <text x="${x}" y="${y+32}" text-anchor="middle" font-family="ChiffresPx, Pixelify Sans, monospace" font-size="17" font-weight="600" fill="${o ? o.couleur : "#8a7a62"}">${o ? esc(o.texte) : "vide"}</text>`; };
  const msg = pente ? "" : objets.length === 2 ? "Prêt à peser !" : "";
  return `<svg viewBox="0 0 300 170" width="100%" shape-rendering="crispEdges" style="display:block;background:#fbf3dc;border:3px solid #2a2420">
    <rect x="132" y="150" width="36" height="12" fill="#5b3a1e"/><rect x="144" y="${cy}" width="12" height="106" fill="#7a5230" stroke="#2a2420" stroke-width="2"/>
    <path d="M${ex[0]} ${ey[0]} L${ex[1]} ${ey[1]}" stroke="#5b3a1e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="8" fill="#f2c335" stroke="#2a2420" stroke-width="2.5"/>
    ${plateau(0)}${plateau(1)}
    <text x="150" y="22" text-anchor="middle" font-family="ChiffresPx, Pixelify Sans, monospace" font-size="15" fill="#5b3a1e">${msg}</text></svg>`;
}

/* ---------- Écrans ---------- */
function accueil(){
  vider();
  const enCours = S.introVue;
  app.innerHTML = `${BADGE}<div class="fond" id="fond"></div>
    <div class="titre-zone"><h1 class="titre p2">${esc(JEU.titre)}</h1><div class="sous p2">${esc(JEU.sousTitre)}</div></div>
    <div class="acteur seul accueil-roi" id="roiAccueil"><div id="sRoi"></div></div>
    <div class="bas">
      ${enCours ? `<button class="btn" id="go">Continuer ▶</button><button class="lien" id="raz">Recommencer depuis le début</button>`
               : `<input class="champ" id="equipe" maxlength="24" placeholder="Nom de votre équipe" value="${esc(S.equipe)}">
                  <button class="btn" id="go">Commencer l'aventure ▶</button>`}
    </div>`;
  monter("#fond", DECORS.accueil, 150, 200);
  monter("#sRoi", PERSOS.roi, 72, 114);
  /* les pieds du Roi passent sous le champ « Nom de votre équipe » */
  const roiA = app.querySelector("#roiAccueil"), bas = app.querySelector(".bas");
  const placerRoi = () => { if(!roiA.isConnected) return removeEventListener("resize", placerRoi);
    roiA.style.bottom = (bas.offsetHeight + 14 - (190 - 150) * roiA.offsetWidth / 120) + "px"; };
  placerRoi(); addEventListener("resize", placerRoi);
  app.querySelector("#go").onclick = () => {
    if(!enCours){
      S.equipe = app.querySelector("#equipe").value.trim() || "Les Aventuriers"; sauver();
      scene({ decor:"mairie", perso:null, texte:JEU.intro, lieu:"Jardin de la mairie", ici:"roi", fin:() => { S.introVue = true; sauver(); recompense(JEU.morceauRoi, S.ordre[0], carte); } });
    } else S.fini ? victoire() : carte();
  };
  const r = app.querySelector("#raz"); if(r) r.onclick = confirmerRaz;
}

function confirmerRaz(){
  const v = document.createElement("div"); v.className = "voile";
  v.innerHTML = `<div class="carnet"><h2 class="p2">Recommencer ?</h2><p style="font-size:18px">Toute la progression de l'équipe sera effacée.</p>
    <div style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="oui">Oui, recommencer</button><button class="btn clair" id="non">Annuler</button></div></div>`;
  document.body.appendChild(v);
  v.querySelector("#oui").onclick = () => { v.remove(); S = VIDE(); sauver(); accueil(); };
  v.querySelector("#non").onclick = () => v.remove();
}

function carte(){
  vider();
  const n = JEU.etapes.length, nb = S.faites.length;
  const style = "B"; // style pixel retenu
  const prochaine = JEU.etapes.findIndex(e => !S.faites.includes(e.id));
  const etat = i => S.faites.includes(JEU.etapes[i].id) ? "fait" : (i === prochaine ? "suivant" : "verrou");
  const etatF = S.fini ? "fait" : (prochaine === -1 ? "suivant" : "verrou");
  const coul = e => e === "fait" ? "var(--vert)" : e === "suivant" ? "var(--rouge)" : "#8a8a8a";
  /* chaque lieu se place soit sur le plan, soit dans la loupe du bourg */
  const lieux = JEU.etapes.map((e,i) => ({ id:e.id, lab:i+1, e:etat(i), c:i })).concat([{ id:"roi", lab:"★", e:etatF, c:"f" }]);
  const mq = (l, ou) => { const [x,y] = POSITIONS[ou][l.id];
    return `<button class="mq ${l.e} ${ou==="loupe"?"petit":""}" data-c="${l.c}" style="left:${x/300*100}%;top:${y/200*100}%">${l.e==="fait"?"✓":l.lab}</button>`; };
  const [zx,zy,zw,zh] = LOUPE_ZONE;
  app.innerHTML = `<div class="carte-page">
    <div class="barre"><span class="p2">${esc(S.equipe)}${JEU.demo ? ` <span style="color:var(--or)">· DÉMO</span>` : ""}</span><button class="btn mini clair" id="carnetBtn">Carnet</button></div>
    <div class="carte"><div id="plan"></div>
      <div class="zone" style="left:${zx/3}%;top:${zy/2}%;width:${zw/3}%;height:${zh/2}%"></div>
      ${lieux.filter(l => POSITIONS.plan[l.id] && !POSITIONS.loupe[l.id]).map(l => mq(l,"plan")).join("")}
      <div class="loupe"><div id="loupeImg"></div><div class="etiq">Le bourg</div>
        ${lieux.filter(l => POSITIONS.loupe[l.id]).map(l => mq(l,"loupe")).join("")}</div>
    </div>
    <div class="osm">Plan : © contributeurs OpenStreetMap · parcours ${(LONGUEUR_M/1000).toFixed(1).replace(".",",")} km</div>
    <div class="liste">
      ${JEU.etapes.map((e,i) => { const s = etat(i); return `<button class="ligne ${s==="verrou"?"verrou":""}" data-c="${i}">
        <span class="n" style="background:${coul(s)}">${s==="fait"?"✓":i+1}</span>
        <span>${esc(e.lieu)}<small>${s==="fait" ? "Terminé — "+esc(e.perso.nom)+" vous a aidés" : s==="suivant" ? "Allez sur place, puis touchez ici" : "Verrouillé"}</small></span></button>`; }).join("")}
      <button class="ligne ${etatF==="verrou"?"verrou":""}" data-c="f"><span class="n" style="background:${coul(etatF)}">★</span>
        <span>${esc(JEU.finale.lieu)}<small>${etatF==="verrou" ? "Finale — trouvez d'abord tous les indices" : "Retournez voir le Roi !"}</small></span></button>
    </div></div>`;
  const res = style === "A" ? [[300,200],[240,160]] : [[210,140],[150,100]];
  monter("#plan", CARTES[style].plan, ...res[0]);
  monter("#loupeImg", CARTES[style].loupe, ...res[1]);
  app.querySelector("#carnetBtn").onclick = carnet;
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    if(c === "f"){ if(etatF === "suivant") finale(); return; }
    if(etat(+c) === "suivant") etape(+c);
  });
}

function etape(i){
  const e = JEU.etapes[i];
  scene({ decor:e.decor, perso:e.perso, texte:e.dialogue, lieu:e.lieu, ici:e.id, fin:() =>
    enigme({ num:i+1, perso:e.perso, enig:e.enigme, indices:e.indices, reussi:() => {
      if(!S.faites.includes(e.id)) S.faites.push(e.id);
      if(!S.persos.includes(e.perso.nom)) S.persos.push(e.perso.nom);
      sauver(); recompense(e.recompense, S.ordre[i + 1]);
    }})});
}

/* Écran d'énigme façon Layton : numéro, feuille, pièces-indices */
function enigme({ num, perso, enig, indices, reussi }){
  vider();
  let vus = 0, saisie = "";
  if(enig.type === "cadenas"){
    saisie = `<div class="cadenas">${Array.from({length:enig.taille},(_,k)=>`<div class="mol">
      <button data-k="${k}" data-d="1" aria-label="Plus">▲</button><div class="chif p2" id="c${k}">0</div>
      <button data-k="${k}" data-d="-1" aria-label="Moins">▼</button></div>`).join("")}</div>
      <button class="btn" id="valider">Ouvrir le cadenas</button>`;
  } else if(enig.type === "texte"){
    saisie = `<input class="champ" id="rep" autocomplete="off" placeholder="${esc(enig.placeholder||"Votre réponse…")}">
      <div style="height:10px"></div><button class="btn" id="valider">Valider</button>`;
  } else if(enig.type === "balance"){
    saisie = `<div id="plateau" style="margin:0 -6px 6px"></div>
      <div class="p2" style="font-size:8px;margin-bottom:6px">1. Touchez 2 cloches pour les poser sur la balance</div>
      <div class="choix" style="grid-template-columns:repeat(3,1fr)">${enig.objets.map((o,k)=>`<button class="opt objb" data-b="${k}" style="flex-direction:column;justify-content:center;gap:2px;text-align:center;padding:6px 4px">
        <svg viewBox="0 0 40 44" width="44" shape-rendering="crispEdges">${cloche(20,2,1,o.couleur)}</svg><b style="color:${o.couleur}">${esc(o.texte)}</b></button>`).join("")}</div>
      <div style="height:8px"></div><button class="btn clair" id="peser">⚖️ Peser</button>
      <div id="journal" style="font-size:17px;margin-top:8px"></div>
      <div class="p2" style="font-size:8px;margin:12px 0 6px">2. Laquelle est la plus lourde ?</div>
      <div class="choix" style="grid-template-columns:repeat(3,1fr)">${enig.objets.map((o,k)=>`<button class="opt repb" data-r="${k}" style="justify-content:center;color:${o.couleur};font-weight:600">${esc(o.texte)}</button>`).join("")}</div>`;
  } else if(enig.type === "classement"){
    saisie = `<div class="p2" style="font-size:8px;margin-bottom:6px">Du plus léger ➜ au plus lourd</div>
      <div id="cases" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px"></div>
      <div class="p2" style="font-size:8px;margin-bottom:6px">Touchez les objets dans l'ordre :</div>
      <div id="reserve" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"></div>
      <div style="height:10px"></div><button class="btn" id="valider" disabled>Vérifier</button>`;
  } else {
    saisie = `<div class="choix">${enig.options.map((o,k)=>`<button class="opt" data-o="${k}"><span data-em="${k}"></span>${esc(o.texte)}</button>`).join("")}</div>`;
  }
  app.innerHTML = `<div class="enigme">
    <div class="entete"><span class="p2">Énigme ${typeof num==="number" ? String(num).padStart(3,"0") : num}</span><span style="display:flex;gap:6px"><button class="btn mini clair" data-hud="carte">Carte</button><button class="btn mini clair" data-hud="carnet">Carnet</button></span></div>
    <div class="feuille" id="feuille"><div class="portrait" id="portrait"></div>
      <p class="question">${esc(enig.question)}</p>${enig.image ? `<div class="rebus" id="rebus"></div>` : ""}${saisie}<div class="msg" id="msg"></div></div>
    <div class="indices-zone"><div class="p2" style="font-size:9px">Pièces d'indice</div>
      <div class="pieces">${indices.map((_,k)=>`<button class="piece" data-i="${k}" ${k>0?"disabled":""}>?</button>`).join("")}</div>
      <div id="indZone"></div></div></div>`;
  brancherHud();
  monter("#portrait", PERSOS[perso.dessin], 72, 114);
  if(enig.type === "choix") enig.options.forEach((o,k) => { if(o.emoji) app.querySelector(`[data-em="${k}"]`).appendChild(emojiPixel(o.emoji)); });
  if(enig.image) enig.image.forEach(t => { const r = app.querySelector("#rebus");
    if(/^[+=\-?]$/.test(t) || /^[IVXLCDM]+$/.test(t)){ const s = document.createElement("span"); s.className = "p2"; s.textContent = t; r.appendChild(s); }
    else { const c = emojiPixel(t, 22); c.style.width = "72px"; r.appendChild(c); } });
  const msg = app.querySelector("#msg"), f = app.querySelector("#feuille");
  const rate = () => { if(valide) return; msg.className = "msg ko"; msg.textContent = "Hmm… pas tout à fait. Réessayez !"; f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); };
  let valide = false;
  const gagne = () => { if(valide) return; valide = true;
    app.querySelectorAll("#feuille button, #feuille input").forEach(el => el.disabled = true);
    msg.className = "msg ok"; msg.textContent = "Bravo ! C'est la bonne réponse !"; setTimeout(reussi, 900); };
  if(enig.type === "cadenas"){
    const v = Array(enig.taille).fill(0);
    app.querySelectorAll(".mol button").forEach(b => b.onclick = () => {
      const k = +b.dataset.k; v[k] = (v[k] + (+b.dataset.d) + 10) % 10; app.querySelector("#c"+k).textContent = v[k]; msg.textContent = ""; });
    app.querySelector("#valider").onclick = () => ok(v.join(""), enig.reponses) ? gagne() : rate();
  } else if(enig.type === "texte"){
    const c = app.querySelector("#rep");
    const test = () => c.value.trim() && (ok(c.value, enig.reponses) ? gagne() : rate());
    app.querySelector("#valider").onclick = test; c.onkeydown = ev => { if(ev.key === "Enter") test(); };
  } else if(enig.type === "balance"){
    /* Les poids sont tirés au hasard à chaque essai : il faut vraiment peser ! */
    let poids, pesees, sel;
    const nom = k => `<b style="color:${enig.objets[k].couleur}">${esc(enig.objets[k].texte)}</b>`;
    const afficher = (pente) => { app.querySelector("#plateau").innerHTML = balanceSVG(sel.map(k => enig.objets[k]), pente); };
    const melanger = () => { poids = [1,2,3].sort(() => Math.random() - .5); pesees = 0; sel = [];
      app.querySelector("#journal").innerHTML = ""; maj(); afficher(0); };
    const maj = () => {
      app.querySelectorAll(".objb").forEach(b => { const on = sel.includes(+b.dataset.b);
        b.style.background = on ? "#fff3b0" : ""; b.style.borderWidth = on ? "4px" : ""; });
      const p = app.querySelector("#peser"), reste = enig.pesees - pesees;
      p.disabled = sel.length !== 2 || reste <= 0;
      p.textContent = reste <= 0 ? "⚖️ Plus de pesée !" : `⚖️ Peser (${reste} pesée${reste > 1 ? "s" : ""} restante${reste > 1 ? "s" : ""})`;
    };
    app.querySelectorAll(".objb").forEach(b => b.onclick = () => { const k = +b.dataset.b;
      sel = sel.includes(k) ? sel.filter(x => x !== k) : sel.concat(k).slice(-2); maj(); afficher(0); });
    app.querySelector("#peser").onclick = () => {
      if(sel.length !== 2 || pesees >= enig.pesees) return;
      const [g, d] = sel, lourd = poids[g] > poids[d] ? g : d, leger = lourd === g ? d : g;
      pesees++; afficher(lourd === g ? -1 : 1);
      const l = document.createElement("div"); l.innerHTML = `Pesée ${pesees} : ${nom(lourd)} est plus lourde que ${nom(leger)}.`;
      app.querySelector("#journal").appendChild(l);
      sel = []; maj();
    };
    app.querySelectorAll(".repb").forEach(b => b.onclick = () => {
      if(poids[+b.dataset.r] === 3) return gagne();
      rate(); msg.textContent = "Raté ! Gaston a mélangé les cloches… Recommencez les pesées !"; melanger();
    });
    melanger();
  } else if(enig.type === "classement"){
    /* vrai mélange (Fisher-Yates), jamais déjà dans le bon ordre, et sans objet à sa place */
    const melange = enig.objets.map((_,k) => k);
    do { for(let i = melange.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [melange[i], melange[j]] = [melange[j], melange[i]]; } }
    while(melange.some((v,i) => v === i));
    let choix = [];
    const vignette = (k, el) => { const o = enig.objets[k];
      if(o.dessin) monter(el, PERSOS[o.dessin], 72, 114); else el.appendChild(emojiPixel(o.emoji)); };
    const dessiner = () => {
      const cases = app.querySelector("#cases"), res = app.querySelector("#reserve");
      cases.innerHTML = ""; res.innerHTML = "";
      enig.objets.forEach((_, i) => {
        const c = document.createElement("button"); c.className = "opt";
        c.style.cssText = "flex-direction:column;justify-content:center;gap:2px;padding:4px;min-height:84px;font-size:15px;text-align:center;border-style:" + (choix[i] === undefined ? "dashed" : "solid");
        if(choix[i] === undefined){ c.innerHTML = `<span class="p2" style="font-size:9px;color:#8a7a62">${i+1}</span>`; }
        else { const v = document.createElement("div"); v.style.width = "44px"; vignette(choix[i], v); c.appendChild(v);
          c.insertAdjacentHTML("beforeend", esc(enig.objets[choix[i]].texte)); c.onclick = () => { choix.splice(i, 1); dessiner(); }; }
        cases.appendChild(c);
      });
      melange.filter(k => !choix.includes(k)).forEach(k => {
        const b = document.createElement("button"); b.className = "opt";
        b.style.cssText = "flex-direction:column;justify-content:center;gap:2px;padding:4px;min-height:84px;font-size:15px;text-align:center";
        const v = document.createElement("div"); v.style.width = "44px"; vignette(k, v); b.appendChild(v);
        b.insertAdjacentHTML("beforeend", esc(enig.objets[k].texte));
        b.onclick = () => { choix.push(k); msg.textContent = ""; dessiner(); };
        res.appendChild(b);
      });
      app.querySelector("#valider").disabled = choix.length !== enig.objets.length;
    };
    app.querySelector("#valider").onclick = () => choix.every((k, i) => k === i) ? gagne() : (rate(), msg.textContent = "Pas tout à fait… Touchez un objet rangé pour le retirer.");
    dessiner();
  } else {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => +b.dataset.o === enig.bonne ? gagne() : rate());
  }
  app.querySelectorAll(".piece").forEach(p => p.onclick = () => {
    const k = +p.dataset.i; if(k !== vus) return;
    const d = document.createElement("div"); d.className = "indice"; d.textContent = `Indice ${k+1} : ${indices[k]}`;
    app.querySelector("#indZone").appendChild(d); p.disabled = true; p.textContent = "✓";
    vus++; S.indices++; sauver();
    const suiv = app.querySelector(`.piece[data-i="${vus}"]`); if(suiv) suiv.disabled = false;
  });
}

const CARTE_POSTALE = CARTES_POSTALES.B;
const MORCEAUX = { cols: 3, rangs: 2 };
let cartePostale = null;
function morceau(k, largeur){
  if(!cartePostale) cartePostale = pixel(CARTE_POSTALE, 240, 160);
  return cartePostale.then(src => {
    const w = src.width / MORCEAUX.cols, h = src.height / MORCEAUX.rangs;
    const c = document.createElement("canvas"); c.width = w; c.height = h; c.className = "px";
    c.getContext("2d").drawImage(src, (k % MORCEAUX.cols) * w, Math.floor(k / MORCEAUX.cols) * h, w, h, 0, 0, w, h);
    if(largeur) c.style.width = largeur;
    return c;
  });
}
/* quels morceaux l'équipe possède : n°1 donné par le Roi, puis un par étape */
/* S.ordre[n] = quel morceau de la carte est donné à l'étape n (0 = le Roi) : l'ordre change à chaque partie */
const morceauxObtenus = () => [S.introVue ? 0 : -1, ...JEU.etapes.map((e,i) => S.faites.includes(e.id) ? i + 1 : -1)].filter(n => n >= 0).map(n => S.ordre[n]);

/* ---------- Écran « nouveau morceau » ---------- */
function recompense(r, k, suite){
  vider();
  app.innerHTML = `${BADGE}<div class="centre">
    <div class="p2" style="font-size:10px;color:var(--or)">Nouveau morceau !</div>
    <div class="objet" id="obj" style="width:150px;border:4px solid var(--parch);box-shadow:0 0 0 3px #000"></div>
    <div class="p2" style="font-size:11px">${esc(r.nom)}</div>
    <div class="carton" style="font-size:19px">${esc(r.texte)}</div>
    <div style="font-size:15px">Rangé dans le carnet du Roi (${morceauxObtenus().length}/6)</div>
    <button class="btn" id="go">Retour à la carte ▶</button></div>`;
  morceau(k, "100%").then(c => app.querySelector("#obj").appendChild(c));
  app.querySelector("#go").onclick = suite || carte;
}

/* ---------- Finale : assembler la carte postale ---------- */
function finale(){
  const f = JEU.finale;
  scene({ decor:"mairie", perso:null, texte:f.dialogue, lieu:f.lieu, ici:"roi", fin: puzzleCarte });
}
function puzzleCarte(){
  vider();
  const f = JEU.finale;
  let ordre = [0,1,2,3,4,5];
  do { ordre.sort(() => Math.random() - .5); } while(ordre.some((v,i) => v === i)); // aucun morceau à sa place au départ
  let choisi = -1;
  app.innerHTML = `<div class="enigme">
    <div class="entete"><span class="p2">Finale</span><span style="display:flex;gap:6px"><button class="btn mini clair" data-hud="carte">Carte</button></span></div>
    <div class="feuille"><p class="question" style="margin-right:0">${esc(f.puzzle)}</p>
      <div id="grille" style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#2a2420;padding:4px"></div>
      <div class="msg" id="msg"></div></div>
    <div class="indices-zone"><div class="p2" style="font-size:9px">Pièce d'indice</div>
      <div class="pieces"><button class="piece" id="aide">?</button><span style="font-size:15px">Affiche le numéro de chaque morceau</span></div></div></div>`;
  brancherHud();
  const grille = app.querySelector("#grille"), msg = app.querySelector("#msg");
  let numeros = false;
  function dessiner(){
    grille.innerHTML = "";
    ordre.forEach((k, pos) => {
      const b = document.createElement("button");
      b.style.cssText = `padding:0;border:3px solid ${pos === choisi ? "var(--or)" : "transparent"};background:#000;position:relative;cursor:pointer`;
      morceau(k, "100%").then(c => { b.prepend(c); });
      if(numeros){ const n = document.createElement("span"); n.className = "p2"; n.textContent = k + 1;
        n.style.cssText = "position:absolute;left:3px;top:3px;font-size:9px;background:#fffaf0;border:2px solid #000;padding:2px 3px"; b.appendChild(n); }
      b.onclick = () => {
        if(choisi < 0){ choisi = pos; dessiner(); return; }
        [ordre[choisi], ordre[pos]] = [ordre[pos], ordre[choisi]]; choisi = -1; dessiner();
        if(ordre.every((v,i) => v === i)){ msg.className = "msg ok"; msg.textContent = "Bravo ! La carte postale est complète !";
          grille.querySelectorAll("button").forEach(x => x.disabled = true); setTimeout(dosCarte, 1200); }
      };
      grille.appendChild(b);
    });
  }
  app.querySelector("#aide").onclick = ev => { if(numeros) return; numeros = true; S.indices++; sauver(); ev.target.disabled = true; ev.target.textContent = "✓"; dessiner(); };
  dessiner();
}
function dosCarte(){
  vider();
  app.innerHTML = `${BADGE}<div class="centre">
    <div class="p2" style="font-size:10px;color:var(--or)">Une carte postale !</div>
    <div id="recto" style="width:100%;border:6px solid #fffaf0;box-shadow:0 0 0 3px #000"></div>
    <div class="carton" style="font-size:19px;text-align:left;font-style:italic;transform:rotate(-1deg)">${esc(JEU.finale.dos)}</div>
    <button class="btn" id="go">Montrer au Roi ▶</button></div>`;
  pixel(CARTE_POSTALE, 240, 160).then(c => { c.style.width = "100%"; app.querySelector("#recto").appendChild(c); });
  app.querySelector("#go").onclick = () => scene({ decor:"mairie", perso:null, texte:JEU.finale.conclusion, lieu:JEU.finale.lieu, ici:"roi",
    fin: () => { S.fini = true; sauver(); victoire(); } });
}

/* ---------- Fin : le Roi entouré de tous les personnages ---------- */
function victoire(){
  vider();
  const date = new Date().toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
  app.innerHTML = `${BADGE}<div class="fond" id="fond"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(rgba(28,22,17,.15),rgba(28,22,17,.65))"></div>
    <div class="p2" style="position:absolute;top:34px;left:0;right:0;text-align:center;font-size:13px;line-height:1.6;color:#fff;text-shadow:2px 2px 0 #000;z-index:3">Aventure terminée !</div>
    <div id="groupe" style="position:absolute;left:0;right:0;bottom:236px;height:46%;z-index:2">
      <div id="g-romain" style="position:absolute;left:-2%;bottom:6%;width:34%"></div>
      <div id="g-marchande" style="position:absolute;right:-2%;bottom:6%;width:34%"></div>
      <div id="g-roi" style="position:absolute;left:25%;bottom:0;width:50%"></div>
      <div id="g-coq" style="position:absolute;left:38%;width:24%"></div>
      <div id="g-boubou" style="position:absolute;right:8%;bottom:-14%;width:30%"></div>
      <div id="g-grenouille" style="position:absolute;left:6%;bottom:-16%;width:30%"></div>
    </div>
    <div class="bas" style="gap:8px">
      <div class="carton" style="text-align:center">
        <div class="p2" style="font-size:8px;color:var(--bois);margin-bottom:8px">Chevaliers des Trois Piliers</div>
        <div style="font-size:24px">${esc(S.equipe)}</div>
        <div style="font-size:17px;margin-top:4px">a retrouvé les amis du Roi des menhirs le ${date}</div>
        <div style="font-size:15px;color:#6b5a48;margin-top:6px">${S.indices} indice${S.indices>1?"s":""} utilisé${S.indices>1?"s":""}</div>
      </div>
      <button class="btn clair" id="acc">Accueil</button></div>`;
  monter("#fond", DECORS.accueil, 150, 200);
  const grp = app.querySelector("#groupe"), roiEl = app.querySelector("#g-roi");
  /* Gaston se perche sur la couronne du Roi */
  app.querySelector("#g-coq").style.bottom = (roiEl.offsetWidth * 190 / 120 * 0.86 / grp.offsetHeight * 100) + "%";
  [["#g-romain","romain"],["#g-boubou","boiliere"],["#g-marchande","marchande"],["#g-roi","roi"],["#g-coq","coq"],["#g-grenouille","grenouille"]]
    .forEach(([sel, d]) => monter(sel, PERSOS[d], 72, 114));
  app.querySelector("#acc").onclick = accueil;
  const cols = ["#b8432c","#f2c335","#4f8a34","#2f5d8a","#d9774a"];
  for(let k=0;k<36;k++){ const c = document.createElement("div"); c.className = "confetti";
    c.style.left = Math.random()*100+"%"; c.style.background = cols[k%5];
    c.style.animationDuration = (2+Math.random()*2.5)+"s"; c.style.animationDelay = Math.random()*.8+"s";
    app.appendChild(c); setTimeout(() => c.remove(), 5500); }
}

/* ---------- Carnet : morceaux de carte postale + personnages rencontrés ---------- */
function carnet(){
  const v = document.createElement("div"); v.className = "voile";
  const eus = morceauxObtenus();
  v.innerHTML = `<div class="carnet"><h2 class="p2">Carnet du Roi</h2>
    <div class="p2" style="font-size:8px">Morceaux de carton (${eus.length}/6)</div>
    <div class="grille">${[0,1,2,3,4,5].map(n => n < eus.length ? `<div class="case" data-m="${eus[n]}">Morceau ${n+1}</div>` : `<div class="case vide"><div class="p2">?</div></div>`).join("")}</div>
    <div class="p2" style="font-size:8px">Rencontres</div>
    <div class="grille">${S.introVue ? `<div class="case" data-p="roi">Le Roi</div>` : `<div class="case vide"><div class="p2">?</div></div>`}${JEU.etapes.map((e,i)=> S.persos.includes(e.perso.nom) ? `<div class="case" data-p="${i}">${esc(e.perso.nom)}</div>` : `<div class="case vide"><div class="p2">?</div></div>`).join("")}</div>
    <p style="font-size:17px">Indices utilisés : ${S.indices}</p>
    <button class="btn clair" id="ferm">Fermer</button></div>`;
  document.body.appendChild(v);
  v.querySelectorAll("[data-m]").forEach(el => morceau(+el.dataset.m, "100%").then(c => el.prepend(c)));
  v.querySelectorAll("[data-p]").forEach(el => { const d = document.createElement("div"); el.prepend(d); monter(d, PERSOS[el.dataset.p === "roi" ? "roi" : JEU.etapes[+el.dataset.p].perso.dessin], 72, 114); });
  v.querySelector("#ferm").onclick = () => v.remove();
  v.onclick = ev => { if(ev.target === v) v.remove(); };
}

accueil();
